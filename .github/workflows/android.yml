name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Android signing keystore
        uses: actions/cache@v4
        with:
          path: android/app/debug.keystore
          key: android-debug-keystore-v2

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          BUILD_ID: ${{ github.run_number }}-${{ github.sha }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ensure debug signing keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          fi
          echo "Android SDK: $ANDROID_HOME"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Show APK signing SHA-1
        id: apk_sha
        run: |
          SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tr -d '\r' | grep -E "SHA-1|SHA1" | head -n 1 | sed 's/.*digest: //')
          if [ -z "$SHA" ]; then
            echo "Could not read the APK signing SHA-1"
            exit 1
          fi
          COMPACT=$(echo "$SHA" | tr -d ':')
          echo "APK SHA-1: $SHA"
          echo "APK SHA-1: $SHA" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=APK SHA-1::$SHA"
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "sha_compact=$COMPACT" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Petroleum-Pump.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Petroleum-Pump-APK-SHA1-${{ steps.apk_sha.outputs.sha_compact }}
          path: Petroleum-Pump.apk
          if-no-files-found: error
          retention-days: 90

      - name: Build summary
        run: |
          echo "### APK ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download **Petroleum-Pump-APK-SHA1-...** from the Artifacts section of this run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The app loads its latest version from GitHub Pages. Install the APK once; future pushes update it automatically." >> $GITHUB_STEP_SUMMARY
