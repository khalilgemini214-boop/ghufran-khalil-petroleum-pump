const INVESTMENT_LABELS = ['Initial investment','Additional investment','Working capital','Pump upgrade','Spare parts','Lease / deposit','Other investment'];
function openInvestmentForm(presetKind, editId){
  const e = editId ? DB.investments.find(x=>x.id===editId) : null;
  const kind = e ? e.kind : (presetKind === 'withdrawal' ? 'withdrawal' : 'capital');
  const shareLabel = 'Shared between partners ('+DB.partners.map(p=>p.share+'%').join(' / ')+')';
  const splitOpts = [{value:'both', label:shareLabel}].concat(DB.partners.map(p=>({value:p.id, label:'Only '+p.name})));
  openModal({
    title: e ? 'Edit investment entry' : (kind === 'withdrawal' ? 'Withdraw investment' : 'Add investment'),
    subtitle: 'Investment is split between the partners by their shares.',
    submitLabel: e ? 'Save changes' : (kind === 'withdrawal' ? 'Save withdrawal' : 'Save investment'),
    footLeft: e ? '<button type="button" class="btn red" data-act="del-investment" data-id="'+e.id+'">'+icon('trash',15)+' Delete</button>' : '',
    body:'<div class="form-grid">'+
      dateField('date','Date',e?e.date:todayISO())+
      selectField('kind','Entry type',[{value:'capital',label:'Add investment'},{value:'withdrawal',label:'Withdraw (minus)'}],kind)+
      moneyField('amount','Amount', e?e.amount:'', {required:true})+
      selectField('split','Shared between',splitOpts,e?e.split||'both':'both')+
      inputField('label','Label',{value:e?e.label||'':'',placeholder:'e.g. Initial investment, pump upgrade'})+
      '<div class="field full"><label for="inv-note">Note</label><textarea id="inv-note" name="note" placeholder="Purpose, reference, etc.">'+esc(e?e.note||'':'')+'</textarea></div>'+
      '<label class="switch full"><input type="checkbox" name="inCash" id="inCash" '+( !e || e.inCash!==false ? 'checked':'')+'><span class="track"></span><span>Money moved in / out of the business cash (updates cash in hand)</span></label>'+
      '<div class="calc-box full" id="inv-preview"></div>'+
      '<div class="form-note full">Investments are split by the ratio above. Cash and capital update immediately. Partner loans are tracked separately on the Loan tab.</div>'+
    '</div><datalist id="inv-labels">'+INVESTMENT_LABELS.map(l=>'<option value="'+attr(l)+'">').join('')+'</datalist>',
    onMount:function(form){
      const lbl = form.querySelector('#label');
      if(lbl) lbl.setAttribute('list','inv-labels');
      const g = n => form.querySelector('#'+n);
      const amtEl = g('amount'), kindEl = g('kind'), splitEl = g('split');
      function preview(){
        const amt = num(amtEl.value) * (kindEl.value === 'withdrawal' ? -1 : 1);
        let html = '<div class="stat-line"><span class="k">Effect on total investment</span><span class="v num">'+(amt<0?'−':'+')+money(Math.abs(amt))+'</span></div>';
        const per = {};
        if(splitEl.value === 'both'){
          DB.partners.forEach(p=>{
            const v = amt * (num(p.share) / 100);
            per[p.id] = v;
            html += '<div class="stat-line"><span class="k">'+esc(p.name)+' ('+p.share+'%)</span><span class="v num">'+(v<0?'−':'+')+money(Math.abs(v))+'</span></div>';
          });
        } else {
          const p = partnerById(splitEl.value);
          per[splitEl.value] = amt;
          html += '<div class="stat-line"><span class="k">'+esc(p.name)+' only</span><span class="v num">'+(amt<0?'−':'+')+money(Math.abs(amt))+'</span></div>';
        }
        if(loansEnabled()){
          DB.loans.filter(l=>l.linkCapital).forEach(l=>{
            const v = per[l.borrowerId] || 0;
            if(!v) return;
            html += '<div class="stat-line" style="border-top:1px dashed var(--line);padding-top:6px"><span class="k">'+esc(loanLabel(l))+'</span><span class="v num">'+(v<0?'−':'+')+money(Math.abs(v))+'</span></div>';
          });
        }
        const box = $('#inv-preview');
        if(box) box.innerHTML = html;
      }
      amtEl.addEventListener('input', preview);
      kindEl.addEventListener('change', preview);
      splitEl.addEventListener('change', preview);
      preview();
    },
    onSubmit:function(fd){
      const amt = num(fd.amount);
      if(amt<=0) fail('Enter an amount greater than zero.');
      const kind = fd.kind === 'withdrawal' ? 'withdrawal' : 'capital';
      const split = fd.split || 'both';
      if(kind === 'withdrawal'){
        const existingWithdrawal = e && e.kind==='withdrawal' ? Math.abs(invAmount(e)) : 0;
        const available = (split === 'both' ? totalCapital() : partnerCapital(split)) + existingWithdrawal;
        if(available <= 0) fail('There is no investment to withdraw yet.');
        if(amt > available + 0.01) fail('You cannot withdraw more than the available investment ('+money(available)+').');
      }
      const rec = {
        date:fd.date, kind, amount:round2(amt), split,
        partnerId: split === 'both' ? null : split,
        label:(fd.label||'').trim() || (kind==='withdrawal'?'Capital withdrawn':'Investment'),
        note:fd.note||'', inCash: fd.inCash === 'on'
      };
      if(e) Object.assign(e, rec);
      else DB.investments.push(Object.assign({id:uid('inv'), createdAt:Date.now()}, rec));
      save(); render();
      return {message: e?'Investment updated':'Investment saved'};
    }
  });
}

  if(DB.partners.length < 2){ toast('Add a second partner before recording a partner loan','err'); return; }

      selectField('loanType','How the amount is set',[
        {value:'fixed',label:'Fixed amount'},
        {value:'capital',label:'Follow the borrower\'s capital share'}
      ],'fixed')+
      dateField('date','Date',todayISO())+
      moneyField('amount','Loan amount',0)+
      '<div class="field full"><label for="loan-note">Note</label><input id="loan-note" name="note" placeholder="Reason for the loan (optional)"></div>'+
      '<div class="calc-box full" id="loan-preview"></div>'+
      '<div class="form-note full">A partner loan is personal between partners. Record repayments on the Loan tab. It does not change the profit-share percentage.</div>'+
    '</div>',
    onMount:function(form){
      const g = n => form.querySelector('#'+n);
      const b = g('borrowerId'), t = g('loanType'), a = g('amount');
      const wrap = a ? a.closest('.field') : null;
      function refresh(){
        const link = t.value === 'capital';
        if(wrap) wrap.style.display = link ? 'none' : '';
        const box = $('#loan-preview');
        if(box) box.innerHTML = loanPreviewHTML(b.value, link, a ? a.value : 0);
      }
      [b,t,a].forEach(function(el){
        if(!el) return;
        el.addEventListener('change', refresh);
        el.addEventListener('input', refresh);
      });
      refresh();
    },
    onSubmit:function(fd){
      if(fd.lenderId === fd.borrowerId) fail('Choose two different partners.');
      const link = fd.loanType === 'capital';
      const amt = num(fd.amount);
      if(!link && amt <= 0) fail('Enter the loan amount.');
      const borrower = partnerById(fd.borrowerId);
      if(link && partnerCapital(borrower.id) <= 0) fail(borrower.name + ' has no capital share yet. Add an investment first, or use a fixed amount.');
      DB.loans.push({
        id:uid('loan'), lenderId:fd.lenderId, borrowerId:fd.borrowerId,
        principal:link ? 0 : round2(amt), linkCapital:link,
        date:fd.date, note:(fd.note||'').trim(), createdAt:Date.now()
      });
      DB.settings.loansEnabled = true;
      DB.settings.loansInitialized = true;
      save(); render();
      return {message:'Partner loan added'};
    }
  });

function confirmDeleteLoan(id){
  const l = DB.loans.find(x=>x.id===id);
  if(!l) return;
  const reps = DB.loanRepayments.filter(r=>r.loanId===id);
  if(reps.length){ toast('This loan has '+reps.length+' repayment'+(reps.length===1?'':'s')+'. Delete those first.','err'); return; }
  openModal({
    title:'Delete this loan?',
    subtitle:loanLabel(l),
    submitLabel:'Delete loan',
    body:'<div class="alert red">'+icon('alert',16)+'<div>Only the loan record is removed. Capital, drawings and repayments already recorded are not changed.</div></div>',
    onSubmit:function(){
      DB.loans = DB.loans.filter(x=>x.id!==id);
      save(); render();
      return {message:'Loan deleted'};
    }
  });
}
function recordLoanRecovery(borrowerId, amount){
  let left = round2(amount);
  const date = todayISO();
  const loans = loansForBorrower(borrowerId).filter(l=>loanOutstandingOf(l) > 0)
    .sort((a,b)=> (a.date<b.date?-1:a.date>b.date?1:0) || ((a.createdAt||0)-(b.createdAt||0)));
  let paid = 0;
  loans.forEach(function(l){
    if(left <= 0) return;
    const out = loanOutstandingOf(l);
    const part = round2(Math.min(out, left));
    if(part <= 0) return;
    DB.loanRepayments.push({
      id:uid('lr'), loanId:l.id, date, amount:part,
      note:'Paid from '+partnerName(borrowerId)+'\'s profit share', createdAt:Date.now()
    });
    left = round2(left - part);
    paid = round2(paid + part);
  });
  if(paid > 0){
    DB.drawings.push({
      id:uid('drw'), date, partnerId:borrowerId, amount:paid,
      note:'Loan repayment', createdAt:Date.now()
    });
    save(); render();
    toast('Loan repayment of '+money(paid)+' recorded','ok');
  } else {
    toast('Nothing left to repay on that loan','ok');
  }
}
function openLoanRepaymentForm(preset){
  const loans = activeLoans().filter(l=>loanOutstandingOf(l) > 0);
  if(!loans.length){ toast('No partner loan is outstanding','ok'); return; }
  preset = preset && typeof preset === 'object' ? preset : {amount:num(preset)};
  const byOut = loans.slice().sort((a,b)=>loanOutstandingOf(b)-loanOutstandingOf(a));
  let loan = null;
  if(preset.loanId) loan = byOut.find(l=>l.id===preset.loanId) || null;
  if(!loan && preset.borrowerId) loan = byOut.find(l=>l.borrowerId===preset.borrowerId) || null;
  if(!loan) loan = byOut[0];
  const out = loanOutstandingOf(loan);
  const def = preset.amount > 0 ? Math.min(preset.amount, out) : out;
  const borrower = partnerById(loan.borrowerId);
  openModal({
    title:'Record loan repayment',
    subtitle:loanLabel(loan)+' · '+money(out)+' outstanding',
    body:'<div class="form-grid">'+
      (loans.length > 1 ? selectField('loanId','Which loan',byOut.map(l=>({value:l.id,label:loanLabel(l)+' · '+money0(loanOutstandingOf(l))+' left'})),loan.id) : '')+
      dateField('date','Date',todayISO())+
      moneyField('amount','Amount repaid',def)+
      inputField('note','Note',{value:'Paid from '+borrower.name+'\'s profit share',full:true})+
      '<label class="switch full"><input type="checkbox" name="asDrawing" id="asDrawing" checked><span class="track"></span><span>Also record this as '+esc(borrower.name)+'\'s drawing (cash paid out of the business)</span></label>'+
    '</div><div class="form-note">The loan is personal between partners, but the money normally leaves the business cash. Keeping the drawing ticked makes cash in hand and the partner settlement correct. Untick it only if the repayment came from outside the business.</div>',
    onSubmit:function(fd){
      const target = fd.loanId ? DB.loans.find(l=>l.id===fd.loanId) : loan;
      if(!target) fail('Select a loan.');
      const targetOut = loanOutstandingOf(target);
      const amt = num(fd.amount);
      if(amt <= 0) fail('Enter a valid amount.');
      if(amt > targetOut + 0.01) fail('Repayment is more than the outstanding loan ('+money(targetOut)+').');
      DB.loanRepayments.push({id:uid('lr'), loanId:target.id, date:fd.date, amount:round2(amt), note:fd.note||'', createdAt:Date.now()});
      if(fd.asDrawing === 'on'){
        DB.drawings.push({id:uid('drw'), date:fd.date, partnerId:target.borrowerId, amount:round2(amt), note:'Loan repayment paid to '+partnerName(target.lenderId), createdAt:Date.now()});
      }
      save(); render();
    }
  });
}

  });

  DB.cashEntries.forEach(c=>{
    const meta = {sourceAct:'edit-cash-entry', sourceId:c.id, deleteAct:'del-cash'};

  });
  DB.purchases.forEach(p=>{ if(num(p.paid)>0 && p.payMethod!=='bank') rows.push({date:p.date, ts:p.createdAt||0, label:'Fuel purchase paid', sub:supplierById(p.supplierId).name+' · '+litres(p.litres), inAmt:0, outAmt:num(p.paid), type:'purchase', sourceAct:'edit-purchase', sourceId:p.id, deleteAct:'del-purchase'}); });
  DB.supplierPayments.forEach(p=>{ if(p.method!=='bank') rows.push({date:p.date, ts:p.createdAt||0, label:'Supplier payment', sub:supplierById(p.supplierId).name, inAmt:0, outAmt:num(p.amount), type:'purchase', sourceAct:'edit-supplier-payment', sourceId:p.id, deleteAct:'del-supplier-payment'}); });
  DB.expenses.forEach(e=>{ if(e.paidFrom!=='bank') rows.push({date:e.date, ts:e.createdAt||0, label:e.category, sub:e.description||'Expense', inAmt:0, outAmt:num(e.amount), type:'expense', sourceAct:'edit-expense', sourceId:e.id, deleteAct:'del-expense'}); });
  DB.salaryPayments.forEach(p=>{ if(p.method!=='bank') rows.push({date:p.date, ts:p.createdAt||0, label:'Salary'+(p.type&&p.type!=='Salary'?' · '+p.type:''), sub:(DB.staff.find(s=>s.id===p.staffId)||{name:'Staff'}).name, inAmt:0, outAmt:num(p.amount), type:'salary', sourceAct:'edit-salary', sourceId:p.id, deleteAct:'del-salary'}); });

function bankLedger(bankId){
  const rows=[];
  const target = bankId || null;
  function match(rec){ return !target || resolvedBankId(rec.bankId) === target; }
  function bankIdOf(rec){ return resolvedBankId(rec.bankId); }
  DB.cashEntries.forEach(c=>{
    if((c.type==='deposit' || c.type==='withdraw') && match(c)){
      const bid = bankIdOf(c);
      const meta = {sourceAct:'edit-cash-entry', sourceId:c.id, deleteAct:'del-cash'};
      if(c.type==='deposit') rows.push({date:c.date, ts:c.createdAt||0, bankId:bid, label:'Cash deposit', sub:c.label||'', inAmt:num(c.amount), outAmt:0, ...meta});
      else rows.push({date:c.date, ts:c.createdAt||0, bankId:bid, label:'Cash withdrawal', sub:c.label||'', inAmt:0, outAmt:num(c.amount), ...meta});
    }
  });
  DB.purchases.forEach(p=>{ if(p.payMethod==='bank' && num(p.paid)>0 && match(p)) rows.push({date:p.date, ts:p.createdAt||0, bankId:bankIdOf(p), label:'Fuel purchase (bank)', sub:supplierById(p.supplierId).name, inAmt:0, outAmt:num(p.paid), sourceAct:'edit-purchase', sourceId:p.id, deleteAct:'del-purchase'}); });
  DB.supplierPayments.forEach(p=>{ if(p.method==='bank' && match(p)) rows.push({date:p.date, ts:p.createdAt||0, bankId:bankIdOf(p), label:'Supplier payment (bank)', sub:supplierById(p.supplierId).name, inAmt:0, outAmt:num(p.amount), sourceAct:'edit-supplier-payment', sourceId:p.id, deleteAct:'del-supplier-payment'}); });
  DB.expenses.forEach(e=>{ if(e.paidFrom==='bank' && match(e)) rows.push({date:e.date, ts:e.createdAt||0, bankId:bankIdOf(e), label:e.category, sub:'Paid from bank', inAmt:0, outAmt:num(e.amount), sourceAct:'edit-expense', sourceId:e.id, deleteAct:'del-expense'}); });
  DB.salaryPayments.forEach(p=>{ if(p.method==='bank' && match(p)) rows.push({date:p.date, ts:p.createdAt||0, bankId:bankIdOf(p), label:'Salary (bank)', sub:(DB.staff.find(s=>s.id===p.staffId)||{name:'Staff'}).name, inAmt:0, outAmt:num(p.amount), sourceAct:'edit-salary', sourceId:p.id, deleteAct:'del-salary'}); });
  DB.customerPayments.forEach(p=>{ if(p.method==='bank' && match(p)) rows.push({date:p.date, ts:p.createdAt||0, bankId:bankIdOf(p), label:'Customer receipt (bank)', sub:(customerById(p.customerId)||{name:'Customer'}).name, inAmt:num(p.amount), outAmt:0, sourceAct:'edit-customer-payment', sourceId:p.id, deleteAct:'del-customer-payment'}); });
  (DB.bankTx||[]).forEach(t=>{ if(match(t)) rows.push({date:t.date, ts:t.createdAt||0, bankId:t.bankId, label:(t.note || (t.type==='credit'?'Bank credit':'Bank debit')), sub:'Manual bank entry', inAmt:t.type==='credit'?num(t.amount):0, outAmt:t.type==='debit'?num(t.amount):0, sourceAct:'edit-bank-tx', sourceId:t.id, deleteAct:'del-bank-tx'}); });
  rows.sort((a,b)=> a.date===b.date ? (a.ts-b.ts) : (a.date<b.date?-1:1));
  return rows;
}

const ACCOUNT_TYPES = ['Customer','Supplier','Bank','Cash','Expense'];
const MANUAL_ACCOUNT_TYPES = ['Customer','Supplier','Cash','Expense'];
const ACCOUNT_META = {

function accountMeta(type){ return ACCOUNT_META[type] || ACCOUNT_META.Customer; }
function systemAccounts(){
  const list = [
    {id:'sys_cash', name:'Cash in Hand', type:'Cash', phone:'', note:'Cash Book', createdAt:0, system:true}
  ];
  DB.banks.forEach(b=>list.push({id:'sys_bank_'+b.id, name:b.name, type:'Bank', phone:'', note:'Bank account', createdAt:b.createdAt||0, system:true, bankId:b.id}));
  DB.suppliers.forEach(s=>list.push({id:'sys_sup_'+s.id, name:s.name, type:'Supplier', phone:s.phone||'', note:s.note||'Fuel supplier', createdAt:s.createdAt||0, system:true, supplierId:s.id}));
  DB.customers.forEach(c=>list.push({id:'sys_cus_'+c.id, name:c.name, type:'Customer', phone:c.phone||'', note:c.note||'Credit customer', createdAt:c.createdAt||0, system:true, customerId:c.id}));
  return list;
}
function allAccounts(){ return systemAccounts().concat(DB.accounts); }
function accountById(id){ return allAccounts().find(a=>a.id===id); }
function entryCmp(a,b){
  return a.date===b.date ? (a.createdAt||0)-(b.createdAt||0) : (a.date<b.date?-1:1);
}
function accountTxList(accountId){
  return DB.accountTx.filter(t=>t.accountId===accountId).sort(entryCmp);
}
function accountEntries(accountId){
  const acc = accountById(accountId);
  if(!acc) return [];
  const out = [];
  if(!acc.system){
    accountTxList(accountId).forEach(t=>out.push({
      id:t.id, date:t.date, createdAt:t.createdAt||0, type:t.type, amount:num(t.amount),
      note:t.note||'', sub:'Manual entry', manual:true
    }));
    return out;
  }
  if(acc.id === 'sys_cash'){
    cashLedger().forEach((r,i)=>{
      const inAmt = num(r.inAmt), outAmt = num(r.outAmt);
      let type = 'credit', amount = 0;
      if(inAmt > 0){ type='credit'; amount=inAmt; }
      else if(inAmt < 0){ type='debit'; amount=-inAmt; }
      else if(outAmt > 0){ type='debit'; amount=outAmt; }
      else if(outAmt < 0){ type='credit'; amount=-outAmt; }
      if(!amount) return;
      out.push({id:'cash_'+i, date:r.date, createdAt:r.ts||0, type, amount, note:r.label, sub:r.sub||'Cash Book', system:true, sourceAct:r.sourceAct, sourceId:r.sourceId, deleteAct:r.deleteAct});
    });
    return out;
  }
  if(acc.bankId){
    const bank = bankById(acc.bankId);
    if(!bank) return [];
    if(num(bank.opening)){
      const created = bank.createdAt ? new Date(bank.createdAt) : null;
      const openDate = created && !isNaN(created.getTime()) ? created.toISOString().slice(0,10) : '2000-01-01';
      out.push({id:'bank_open_'+bank.id, date:openDate, createdAt:0,
        type:num(bank.opening)>0?'credit':'debit', amount:Math.abs(num(bank.opening)),
        note:'Opening bank balance', sub:bank.name, system:true, sourceAct:'edit-bank', sourceId:bank.id});
    }
    bankLedger(bank.id).forEach((r,i)=>{
      const inAmt = num(r.inAmt), outAmt = num(r.outAmt);
      let type = 'credit', amount = 0;
      if(inAmt > 0){ type='credit'; amount=inAmt; }
      else if(inAmt < 0){ type='debit'; amount=-inAmt; }
      else if(outAmt > 0){ type='debit'; amount=outAmt; }
      else if(outAmt < 0){ type='credit'; amount=-outAmt; }
      if(!amount) return;
      out.push({id:'bank_'+bank.id+'_'+i, date:r.date, createdAt:r.ts||0, type, amount, note:r.label, sub:r.sub||bank.name, system:true, sourceAct:r.sourceAct, sourceId:r.sourceId, deleteAct:r.deleteAct});
    });
    return out;
  }
  if(acc.supplierId){
    const s = DB.suppliers.find(x=>x.id===acc.supplierId);
    if(!s) return [];
    if(num(s.openingBalance)){
      const created = s.createdAt ? new Date(s.createdAt) : null;
      const openDate = created && !isNaN(created.getTime()) ? created.toISOString().slice(0,10) : '2000-01-01';
      const credit = num(s.openingBalance) > 0;
      out.push({id:'sup_open', date:openDate, createdAt:0, type:credit?'credit':'debit',
        amount:Math.abs(num(s.openingBalance)), note:'Opening balance', sub:'Supplier', system:true, sourceAct:'edit-supplier', sourceId:s.id});
    }
    DB.purchases.filter(p=>p.supplierId===s.id).forEach(p=>{
      out.push({id:'sup_p_'+p.id, date:p.date, createdAt:p.createdAt||0, type:'credit',
        amount:num(p.amount), note:'Purchase · '+productById(p.product).name+' · '+litres(p.litres),
        sub:(p.invoice?p.invoice+' · ':'')+'Fuel purchase', system:true, sourceAct:'edit-purchase', sourceId:p.id, deleteAct:'del-purchase'});
      if(num(p.paid) > 0){
        out.push({id:'sup_pp_'+p.id, date:p.date, createdAt:(p.createdAt||0)+1, type:'debit',
          amount:num(p.paid), note:'Paid at purchase',
          sub:(p.payMethod==='bank'?'Bank · '+bankNameOf(p.bankId):'Cash')+' · '+s.name, system:true, sourceAct:'edit-purchase', sourceId:p.id, deleteAct:'del-purchase'});
      }
    });
    DB.supplierPayments.filter(p=>p.supplierId===s.id).forEach(p=>{
      out.push({id:'sup_sp_'+p.id, date:p.date, createdAt:p.createdAt||0, type:'debit',
        amount:num(p.amount), note:'Payment to supplier',
        sub:(p.method==='bank'?'Bank · '+bankNameOf(p.bankId):'Cash')+(p.note?' · '+p.note:''), system:true,
        sourceAct:'edit-supplier-payment', sourceId:p.id, deleteAct:'del-supplier-payment'});
    });
    return out;
  }
  if(acc.customerId){
    DB.sales.filter(s=>s.customerId===acc.customerId && num(s.credit)>0).forEach(s=>{
      out.push({id:'cus_s_'+s.id, date:s.date, createdAt:s.createdAt||0, type:'credit',
        amount:num(s.credit), note:'Credit sale · '+productById(s.product).name+' · '+litres(s.litres),
        sub:'Sale'+(s.note?' · '+s.note:''), system:true, sourceAct:'edit-sale', sourceId:s.id, deleteAct:'del-sale'});
    });
    DB.customerPayments.filter(p=>p.customerId===acc.customerId).forEach(p=>{
      out.push({id:'cus_p_'+p.id, date:p.date, createdAt:p.createdAt||0, type:'debit',
        amount:num(p.amount), note:'Payment received',
        sub:(p.method==='bank'?'Bank · '+bankNameOf(p.bankId):'Cash')+(p.note?' · '+p.note:''), system:true,
        sourceAct:'edit-customer-payment', sourceId:p.id, deleteAct:'del-customer-payment'});
    });
    return out;
  }
  return out;
}
function withBalances(entries){
  let run = 0;
  return entries.slice().sort(entryCmp).map(e=>{
    run += (e.type==='credit'?1:-1) * num(e.amount);
    return Object.assign({}, e, {balance:round2(run)});
  });
}
function accountStats(accountId){
  let credit = 0, debit = 0;
  accountEntries(accountId).forEach(e=>{
    if(e.type==='credit') credit += num(e.amount);
    else debit += num(e.amount);
  });
  return {credit:round2(credit), debit:round2(debit), balance:round2(credit-debit)};
}
function accountsTotals(){
  let credit = 0, debit = 0;
  allAccounts().forEach(a=>{
    const b = accountStats(a.id).balance;
    if(b > 0) credit += b;
    else if(b < 0) debit += -b;
  });
  return {credit:round2(credit), debit:round2(debit), balance:round2(credit-debit)};
}
function accountLastActivity(a){
  const list = withBalances(accountEntries(a.id));
  if(list.length){
    const t = list[list.length-1];
    return (t.createdAt||0) || (t.date ? new Date(t.date+'T00:00:00').getTime() : 0);
  }
  return a.createdAt || 0;
}
function accountLastText(a){
  const list = withBalances(accountEntries(a.id));
  if(!list.length) return 'No entries';
  const t = list[list.length-1];
  return fmtDate(t.date) + (t.note ? ' · '+t.note : '');
}
function accountsFiltered(){
  const q = UI.accSearch.toLowerCase();
  return allAccounts().filter(a=>{
    if(UI.accType !== 'all' && a.type !== UI.accType) return false;
    if(q){
      const hay = [a.name, a.phone, a.note, a.type].join(' ').toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }).sort((a,b)=>{
    const wa = a.id==='sys_cash'?0:(a.bankId?1:2);
    const wb = b.id==='sys_cash'?0:(b.bankId?1:2);
    if(wa !== wb) return wa - wb;
    return (accountLastActivity(b) - accountLastActivity(a)) || a.name.localeCompare(b.name);
  });
}

function buildLabel(){
  const m = document.querySelector('meta[name="app-build"]');
  const v = m ? (m.content || '') : '';
  if(!v || v.indexOf('__') === 0) return 'Local preview';
  return v.length > 18 ? v.slice(0, 18) + '…' : v;
}

function saveSettings(){
  const val = id => { const el=$('#'+id); return el?el.value:''; };
  const pumpName = val('set-pumpName').trim();
  if(!pumpName){ toast('Business / pump name cannot be empty','err'); return; }
  DB.settings.pumpName = pumpName;
  DB.settings.address = val('set-address').trim();
  DB.settings.phone = val('set-phone').trim();
  DB.settings.openingCash = num(val('set-openingCash'));
  if(DB.partners.length){
    const names = DB.partners.map((p,i)=>val('set-p-name-'+i).trim());
    const roles = DB.partners.map((p,i)=>val('set-p-role-'+i).trim());
    const shares = DB.partners.map((p,i)=>num(val('set-p-share-'+i)));
    if(names.some(n=>!n)){ toast('Partner names cannot be empty','err'); return; }
    const total = round2(sum(shares));
    if(Math.abs(total - 100) > 0.01){ toast('Partner shares must add up to 100% (currently '+total+'%)','err'); return; }
    DB.partners.forEach((p,i)=>{
      p.name = names[i];
      p.role = roles[i] || 'Partner';
      p.share = round2(shares[i]);
    });
  }
  const loansToggle = $('#set-loans-enabled');
  if(loansToggle){
    DB.settings.loansEnabled = !!loansToggle.checked;
    DB.settings.loansInitialized = true;
  }
  DB.products.forEach(p=>{
    const el = $('#set-rate-'+p.id);
    if(el && el.value !== ''){
      const r = num(el.value);
      if(r > 0 && Math.abs(r - currentRate(p.id)) > 0.001){
        DB.rateHistory.push({id:uid('rate'), product:p.id, rate:r, date:todayISO(), createdAt:Date.now()});
        DB.rates[p.id] = r;
      }
    }
  });
  document.title = appTitle();
  save(); render();
  toast('Settings saved','ok');
}
function addPartner(){
  if(DB.partners.length >= 8){ toast('That is a lot of partners — 8 is the maximum','err'); return; }
  DB.partners.push({id:uid('p'), name:'Partner '+(DB.partners.length+1), role:'Partner', share:0});
  DB.settings.loansInitialized = true;
  save(); render();
  toast('Partner added — enter a name and set shares so the total is 100%','ok');
}
function confirmRemovePartner(id){
  const p = partnerById(id);
  if(!p || !p.id) return;
  if(DB.partners.length <= 1){ toast('Keep at least one partner','err'); return; }
  if(Math.abs(partnerCapital(id)) > 0.004){ toast('This partner has capital in the pump. Adjust or withdraw it before deleting the partner.','err'); return; }
  const used = (DB.drawings||[]).some(d=>d.partnerId===id) ||
    (DB.loans||[]).some(l=>l.lenderId===id || l.borrowerId===id);
  if(used){ toast('This partner has drawings or partner loans. Remove those first.','err'); return; }
  openModal({
    title:'Remove '+p.name+'?',
    subtitle:'Their share must be added to the remaining partners.',
    submitLabel:'Remove partner',
    body:'<div class="alert amber">'+icon('alert',16)+'<div><b>'+esc(p.name)+'</b> will be removed from the partner list. Their '+p.share+'% share is added to the remaining partners in proportion to their current shares.</div></div>',
    onSubmit:function(){
      DB.partners = DB.partners.filter(x=>x.id!==id);
      const total = sum(DB.partners, x=>x.share);
      if(DB.partners.length){
        if(total > 0){
          DB.partners.forEach(x=>{ x.share = round2(x.share / total * 100); });
          const diff = round2(100 - sum(DB.partners, x=>x.share));
          if(diff) DB.partners[DB.partners.length-1].share = round2(DB.partners[DB.partners.length-1].share + diff);
        } else {
          DB.partners[0].share = 100;
        }
      }
      save(); render();
      return {message:'Partner removed'};
    }
  });
}

      const nzSel = g('nozzleId'), readEl = g('reading');
      function refresh(){
        const prev = latestMeter(nzSel.value);
        const hasVal = readEl.value !== '';
        $('#mr-current').textContent = nfMoney.format(prev) + ' L';
        $('#mr-diff').textContent = hasVal ? nfMoney.format(num(readEl.value)) + ' L' : '—';

function isNativeApp(){
  try {
    if(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function') return !!window.Capacitor.isNativePlatform();
  } catch(e){}
  return /;\s*wv\)/i.test(navigator.userAgent || '');
}
function backupJSON(){

function openBackupText(){
  const json = JSON.stringify(DB, null, 2);
  const kb = Math.max(1, Math.round(json.length / 1024));
  const canShare = typeof navigator.share === 'function';
  const canDownload = !isNativeApp();
  const canNativeShare = canNativeShareBackup();
  openModal({
    title:'Backup text',
    subtitle:'Complete backup · '+kb+' KB · keep it outside this phone',
    footer:false,
    body:'<div class="alert amber">'+icon('alert',17)+'<div><b>Do not uninstall the app</b> until this text is saved somewhere else. All data lives only on this phone.</div></div>'+
      '<textarea id="backup-json" readonly style="min-height:260px;font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.45;white-space:pre">'+esc(json)+'</textarea>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button type="button" class="btn block" data-act="copy-backup">'+icon('file',15)+' Copy all</button>'+
        (canNativeShare ? '<button type="button" class="btn green" data-act="share-backup-file">'+icon('upload',15)+' Share file</button>' : '')+
        (canShare ? '<button type="button" class="btn ghost" data-act="share-backup-text">'+icon('upload',15)+' Share…</button>' : '')+
        (canDownload ? '<button type="button" class="btn ghost" data-act="download-backup-file">'+icon('download',15)+' Download file</button>' : '')+
        '<button type="button" class="btn ghost" data-act="close-modal">Close</button>'+
      '</div>'+
      '<div class="form-note">Tap <b>Copy all</b>, then paste it into WhatsApp (message yourself), an email to yourself, or a notes app. '+(canNativeShare?'Or tap <b>Share file</b> and choose WhatsApp — that sends the backup as a .json file. ':'')+'If WhatsApp refuses a message this large, use email or notes. To put the data back later, open <b>Restore from text</b> and paste this text.</div>'
  });
}

  const ta = $('#backup-json');

/* Stable JSON so field order from Firestore never looks like a change. */
function stableJSON(v){
  if(v === undefined) return 'null';
  if(v === null || typeof v !== 'object') return JSON.stringify(v);
  if(Array.isArray(v)) return '[' + v.map(stableJSON).join(',') + ']';
  return '{' + Object.keys(v).sort().map(function(k){
    return JSON.stringify(k) + ':' + stableJSON(v[k]);
  }).join(',') + '}';
}
function cloudSettingsSig(settings, rates){

}

/* Offline deletion tracking. Deletions made without internet are remembered
   and sent as tombstones the next time the cloud is reachable, even after the
   app is closed and reopened. */
let LOCAL_KNOWN = null;
function allDocKeys(){
  const keys = [];
  CLOUD_COLLECTIONS.forEach(function(coll){
    (DB[coll] || []).forEach(function(doc){
      if(doc && doc.id) keys.push(coll + '/' + doc.id);
    });
  });
  return keys;
}
function knownDocsKey(){
  const sid = DB.meta && DB.meta.stationId || 'base';
  return CLOUD_INDEX_KEY + '_' + sid;
}
function persistKnownDocs(){
  try {
    localStorage.setItem(knownDocsKey(), JSON.stringify({
      stationId: DB.meta && DB.meta.stationId || '',
      keys: Array.from(LOCAL_KNOWN || [])
    }));
  } catch(e){}
}
function localKnownReset(){
  LOCAL_KNOWN = new Set(allDocKeys());
  persistKnownDocs();
}
function localKnownInit(){
  try {
    const raw = JSON.parse(localStorage.getItem(knownDocsKey()) || 'null');
    const sid = DB.meta && DB.meta.stationId || '';
    if(raw && raw.stationId && sid && raw.stationId === sid && Array.isArray(raw.keys)){
      LOCAL_KNOWN = new Set(raw.keys);
      localTrackRemovals();
      return;
    }
  } catch(e){}
  localKnownReset();
}
function pendingKey(sid){
  return CLOUD_PENDING_DEL_KEY + '_' + sid;
}
function pendingStore(sid){
  try { return JSON.parse(localStorage.getItem(pendingKey(sid)) || 'null'); }
  catch(e){ return null; }
}
function pendingDeletesFor(sid){
  const s = pendingStore(sid);
  if(!s || !sid || s.stationId !== sid || !Array.isArray(s.keys)) return [];
  return s.keys;
}
function addPendingDeletes(keys){
  const sid = DB.meta && DB.meta.stationId;
  if(!sid || !keys.length) return;
  const cur = pendingDeletesFor(sid);
  try {
    localStorage.setItem(pendingKey(sid), JSON.stringify({stationId:sid, keys:Array.from(new Set(cur.concat(keys)))}));
  } catch(e){}
}
function removePendingDeletes(sid, keys){
  const cur = pendingDeletesFor(sid);
  if(!cur.length) return;
  const done = new Set(keys);
  const left = cur.filter(function(k){ return !done.has(k); });
  try {
    if(left.length) localStorage.setItem(pendingKey(sid), JSON.stringify({stationId:sid, keys:left}));
    else localStorage.removeItem(pendingKey(sid));
  } catch(e){}
}
function localTrackRemovals(){
  if(!LOCAL_KNOWN) return;
  const current = new Set(allDocKeys());
  const removed = [];
  LOCAL_KNOWN.forEach(function(k){ if(!current.has(k)) removed.push(k); });
  if(removed.length) addPendingDeletes(removed);
  LOCAL_KNOWN = current;
  persistKnownDocs();
}

function localSwitchUser(user){
  const uid = user && user.uid;
  if(!uid) return false;
  if(ACTIVE_UID === uid) return false;
  if(ACTIVE_UID) saveLocalOnly();
  let raw = null;
  try { raw = localStorage.getItem(localDbKey(uid)); } catch(e){}
  if(!raw){
    let legacy = null, owner = null;
    try {
      legacy = localStorage.getItem(DB_KEY_BASE);
      owner = localStorage.getItem(LEGACY_OWNER_KEY);
    } catch(e){}
    if(legacy && !owner){
      try {
        localStorage.setItem(localDbKey(uid), legacy);
        localStorage.setItem(LEGACY_OWNER_KEY, uid);
        localStorage.removeItem(DB_KEY_BASE);
      } catch(e){}
      raw = legacy;
    }
  }
  let data;
  try { data = raw ? migrate(JSON.parse(raw)) : seedData(); }
  catch(e){ data = seedData(); }
  // The UID is the station ID — one account can never touch another account.
  data.meta.stationId = uid;
  if(!raw){
    data.settings.setupComplete = false;
    data.settings.setupDismissed = false;
  }
  DB = data;
  DB_KEY = localDbKey(uid);
  ACTIVE_UID = uid;
  applyTheme();
  SYNC.last = {};
  CLOUD.hasStation = false;
  CLOUD.lastSync = 0;

function unsyncedCount(){
  if(!CLOUD.user || !CLOUD.stationId || CLOUD.resuming) return null;
  if(!SYNC.last || !Object.keys(SYNC.last).length) return null;
  let n = 0;
  CLOUD_COLLECTIONS.forEach(function(coll){
    const arr = DB[coll];
    if(!Array.isArray(arr)) return;
    arr.forEach(function(doc){
      if(!doc) return;
      if(!doc.id){ n++; return; }
      if(SYNC.last[coll + '/' + doc.id] !== stableJSON(doc)) n++;
    });
  });
  if(SYNC.last['settings/main'] !== cloudSettingsSig(DB.settings, DB.rates)) n++;
  n += pendingDeletesFor(CLOUD.stationId).length;
  return n;
}

/* ---------------- Firebase SDK ---------------- */
const cloudScriptPromises = {};
function loadCloudScript(src){
  if(cloudScriptPromises[src]) return cloudScriptPromises[src];
  cloudScriptPromises[src] = new Promise(function(resolve, reject){
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.onload = function(){ resolve(); };
    s.onerror = function(){
      delete cloudScriptPromises[src];
      reject(new Error('Could not download Firebase. Check the internet connection.'));
    };
    document.head.appendChild(s);
  });
  return cloudScriptPromises[src];
}
async function loadCloudSdk(){
  if(window.firebase && window.firebase.initializeApp) return;
  const base = 'https://www.gstatic.com/firebasejs/' + CLOUD_SDK_VERSION + '/';
  await loadCloudScript(base + 'firebase-app-compat.js');
  await loadCloudScript(base + 'firebase-auth-compat.js');
  await loadCloudScript(base + 'firebase-firestore-compat.js');
  if(!window.firebase) throw new Error('Firebase did not load.');
}
async function cloudInit(cfg){
  if(CLOUD.ready) return;
  if(CLOUD.initializing) return;
  CLOUD.initializing = true;
  try{
    await loadCloudSdk();
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    CLOUD.auth = firebase.auth();
    CLOUD.db = firebase.firestore();
    try { await CLOUD.db.enablePersistence({synchronizeTabs:true}); } catch(e){}
    try { CLOUD.db.settings({ignoreUndefinedProperties:true}); } catch(e){}
    try { await CLOUD.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch(e){}
    CLOUD.configured = true;
    CLOUD.ready = true;
  } finally {
    CLOUD.initializing = false;
  }
}
function cloudBindAuth(){
  if(CLOUD.authBound || !CLOUD.auth) return;
  CLOUD.authBound = true;
  CLOUD.auth.onAuthStateChanged(function(user){ cloudAuthChanged(user); });
}

/* ---------------- boot / auth flow ---------------- */
async function cloudBoot(background){
  CLOUD.configured = true;
  if(!background) gateLoading('Connecting to your hisab…', 'First load may take a few seconds');
  try{
    await cloudInit(cloudCfg());
  } catch(e){
    if(background){
      CLOUD.status = navigator.onLine ? 'error' : 'offline';
      CLOUD.error = e && e.message || '';
      cloudStatusRefresh();
      return;
    }
    const session = cloudSession();
    if(session && session.uid){
      localSwitchUser(session);
      CLOUD.user = {uid:session.uid, email:session.email || '', name:session.name || '', photo:session.photo || ''};
      CLOUD.stationId = session.uid;
      CLOUD.status = 'offline';
      CLOUD.backgroundBoot = true;
      if(DB.settings.setupComplete) startCloudApp();
      else startOnboarding();
      toast('Cloud is unreachable — working on this device', 'err');
    } else {
      showAuthScreen(e.message || 'Could not reach the cloud.');
    }
    return;
  }
  cloudBindAuth();
  if(!background) cloudCheckRedirect();
}
async function cloudCheckRedirect(){
  if(!CLOUD.auth) return;
  try{
    await CLOUD.auth.getRedirectResult();
    // onAuthStateChanged opens the account when a redirect completes.
  }catch(e){
    const code = (e && e.code) || '';
    if(code && code !== 'auth/no-auth-event'){
      showAuthScreen(cloudAuthError(e));
    }
  }
}
function cloudAuthChanged(user){
  if(!user){
    if(CLOUD.backgroundBoot){
      // The app was opened from a saved local session. Keep it usable; the
      // user can sign out or sign in again from Settings.
      CLOUD.status = navigator.onLine ? 'connecting' : 'offline';
      cloudStatusRefresh();
      return;
    }
    const wasSignedIn = !!(CLOUD.user || CLOUD.enteredUid || APP_STARTED);
    cloudStopSync();
    CLOUD.user = null;
    CLOUD.stationId = null;
    CLOUD.enteredUid = null;
    CLOUD.status = 'local';
    CLOUD.backgroundBoot = false;
    CLOUD.resuming = false;
    CLOUD.resumedUid = null;
    clearCloudSession();
    APP_STARTED = false;
    localClearToGate(wasSignedIn);
    showAuthScreen();
    return;
  }
  if(CLOUD.backgroundBoot && CLOUD.user && user.uid === CLOUD.user.uid){
    CLOUD.enteredUid = user.uid;
    CLOUD.user.name = user.displayName || CLOUD.user.name || '';
    CLOUD.user.photo = user.photoURL || CLOUD.user.photo || '';
    saveCloudSession();
    cloudResume(user);
    return;
  }
  if(CLOUD.backgroundBoot){
    CLOUD.status = 'error';
    CLOUD.error = 'The signed-in account changed. Sign out and sign in again to sync the right hisab.';
    cloudStatusRefresh();
    return;
  }
  if(CLOUD.enteredUid === user.uid && (APP_STARTED || ONB.active)) return;
  // Load this Google account's own local hisab BEFORE touching the cloud.
  localSwitchUser(user);
  CLOUD.enteredUid = user.uid;
  CLOUD.user = {
    uid:user.uid,
    email:user.email || '',
    name:user.displayName || '',
    photo:user.photoURL || ''
  };
  saveCloudSession();
  cloudEnter(user);
}
async function cloudEnter(user){
  if(CLOUD.entering) return;
  CLOUD.entering = true;
  gateBusy(true, 'Opening your hisab…');
  try{
    const uid = user.uid;
    // One station per Google UID. This is the isolation boundary.
    const sid = uid;
    CLOUD.stationId = sid;
    CLOUD.db.doc('users/' + uid).set({
      email:CLOUD.user.email || '',
      displayName:CLOUD.user.name || '',
      photoURL:CLOUD.user.photo || '',
      stationId:uid,
      lastSeenAt:Date.now()
    }, {merge:true}).catch(function(){});

    const stationSnap = await CLOUD.db.doc('stations/' + sid).get();
    CLOUD.hasStation = !!stationSnap.exists;
    if(!stationSnap.exists){
      gateBusy(false);
      if(DB.settings.setupComplete){
        gateBusy(true, 'Creating your cloud hisab…', 'Uploading this account’s data');
        await cloudCreateStation();
        cloudStartSync();
        gateBusy(false);
        startCloudApp();
        toast('Cloud hisab created for this account', 'ok');
      } else {
        startOnboarding();
      }
      return;
    }

    const metaSnap = await CLOUD.db.doc('stations/' + sid + '/settings/main').get();
    const remoteMeta = metaSnap.exists ? metaSnap.data() : null;
    const remoteReady = !!(remoteMeta && remoteMeta.settings && remoteMeta.settings.setupComplete);

    const remote = await cloudPullAll();
    cloudFilterPendingDeletes(remote);
    if(remoteReady){
      const localReady = !!(DB.settings && DB.settings.setupComplete);
      if(localReady) cloudMergeRemote(remote);
      else cloudAdoptRemote(remote);
      DB.meta.stationId = sid;
      DB.settings.setupComplete = true;
      DB.settings.setupDismissed = true;
      cloudSeedLast(remote);
      saveLocalOnly();
      localKnownReset();
      cloudStartSync();
      gateBusy(false);
      startCloudApp();
    } else {
      DB.meta.stationId = sid;
      saveLocalOnly();
      localKnownReset();
      gateBusy(false);
      startOnboarding();
    }
  } catch(e){
    gateBusy(false);
    CLOUD.error = e && e.message || String(e);
    showAuthScreen('Could not open your hisab. ' + cloudFriendlyError(e));
  } finally {
    CLOUD.entering = false;
  }
}
async function cloudResume(user){
  if(!CLOUD.ready || !CLOUD.user || !user) return;
  if(ONB.active) return; // the setup wizard uploads when it finishes
  if(CLOUD.resuming) return;
  if(CLOUD.resumedUid === user.uid && SYNC.unsubs.length){
    cloudSetStatus(navigator.onLine ? 'online' : 'offline');
    cloudPush();
    return;
  }
  CLOUD.resuming = true;
  CLOUD.stationId = user.uid;
  cloudSetStatus('connecting');
  try{
    const sid = user.uid;
    CLOUD.db.doc('users/' + sid).set({
      email:CLOUD.user.email || '',
      displayName:CLOUD.user.name || '',
      photoURL:CLOUD.user.photo || '',
      stationId:sid,
      lastSeenAt:Date.now()
    }, {merge:true}).catch(function(){});

    const stationSnap = await CLOUD.db.doc('stations/' + sid).get();
    CLOUD.hasStation = !!stationSnap.exists;
    if(!stationSnap.exists){
      if(DB.settings.setupComplete){
        await cloudCreateStation();
        CLOUD.resumedUid = sid;
        CLOUD.resuming = false;
        cloudStartSync();
      } else {
        CLOUD.resuming = false;
        CLOUD.status = 'offline';
        cloudStatusRefresh();
      }
      return;
    }

    const metaSnap = await CLOUD.db.doc('stations/' + sid + '/settings/main').get();
    const remoteMeta = metaSnap.exists ? metaSnap.data() : null;
    const remoteReady = !!(remoteMeta && remoteMeta.settings && remoteMeta.settings.setupComplete);
    const remote = await cloudPullAll();
    cloudFilterPendingDeletes(remote);

    if(remoteReady){
      const localReady = !!(DB.settings && DB.settings.setupComplete);
      if(localReady) cloudMergeRemote(remote);
      else cloudAdoptRemote(remote);
      DB.meta.stationId = sid;
      DB.settings.setupComplete = true;
      DB.settings.setupDismissed = true;
      cloudSeedLast(remote);
      saveLocalOnly();
      localKnownReset();
      CLOUD.resumedUid = sid;
      CLOUD.resuming = false;
      cloudStartSync();
    } else {
      DB.meta.stationId = sid;
      saveLocalOnly();
      localKnownReset();
      if(DB.settings.setupComplete){
        SYNC.last = {};
        CLOUD.resuming = false;
        await cloudPush();
        CLOUD.resumedUid = sid;
        cloudStartSync();
      } else {
        CLOUD.resuming = false;
        CLOUD.status = 'offline';
        cloudStatusRefresh();
      }
    }
  } catch(e){
    CLOUD.resuming = false;
    CLOUD.error = e && e.message || String(e);
    cloudSetStatus('error');
  } finally {
    CLOUD.resuming = false;
    if(APP_STARTED && UI.page === 'dashboard' && !document.body.classList.contains('modal-open')) render();
    refreshUnsynced();
  }
}
async function cloudCreateStation(){
  const uid = CLOUD.user.uid;
  const sid = uid;
  await CLOUD.db.doc('stations/' + sid).set({
    name: displayName(),
    ownerUid: uid,
    ownerEmail: CLOUD.user.email || '',
    schemaVersion: 1,
    createdAt: Date.now(),
    updatedAt: Date.now()
  });
  await CLOUD.db.doc('users/' + uid).set({
    email:CLOUD.user.email || '',
    displayName:CLOUD.user.name || '',
    photoURL:CLOUD.user.photo || '',
    stationId:sid,
    updatedAt:Date.now()
  }, {merge:true});
  CLOUD.stationId = sid;
  CLOUD.hasStation = true;
  DB.meta.stationId = sid;
  DB.meta.schema = 1;
  saveLocalOnly();
  localKnownReset();
  SYNC.last = {};
  await cloudPush();
}

/* ---------------- first download / merge ---------------- */
async function cloudPullAll(){
  const sid = CLOUD.stationId;
  const out = {settings:null, docs:{}, tombstones:[]};
  const ss = await CLOUD.db.doc('stations/' + sid + '/settings/main').get();
  if(ss.exists) out.settings = ss.data();
  for(let i=0; i<CLOUD_COLLECTIONS.length; i++){
    const coll = CLOUD_COLLECTIONS[i];
    const snap = await CLOUD.db.collection('stations/' + sid + '/' + coll).get();
    out.docs[coll] = snap.docs.map(function(d){
      const data = d.data() || {};
      if(!data.id) data.id = d.id;
      return data;
    });
  }
  try{
    const ts = await CLOUD.db.collection('stations/' + sid + '/tombstones').get();
    out.tombstones = ts.docs.map(function(d){ return d.data(); });
  } catch(e){}
  return out;
}
function cloudFilterPendingDeletes(remote){
  const pending = pendingDeletesFor(CLOUD.stationId);
  if(!pending.length) return;
  const ps = new Set(pending);
  CLOUD_COLLECTIONS.forEach(function(c){
    remote.docs[c] = (remote.docs[c] || []).filter(function(d){ return !ps.has(c + '/' + d.id); });
  });
}
function cloudAdoptRemote(remote){
  CLOUD_COLLECTIONS.forEach(function(c){ DB[c] = (remote.docs[c] || []).slice(); });
  if(remote.settings){
    DB.settings = Object.assign({}, DB.settings, remote.settings.settings || {}, {theme:DB.settings.theme});
    DB.rates = Object.assign({}, DB.rates, remote.settings.rates || {});
  }
  if(!(remote.settings && remote.settings.settings && remote.settings.settings.loansInitialized)){
    legacyLoanSeed(DB);
    DB.settings.loansInitialized = true;
  }
  DB.settings.setupComplete = true;
  DB.settings.setupDismissed = true;
}
function cloudMergeRemote(remote){
  CLOUD_COLLECTIONS.forEach(function(c){
    const map = new Map();
    (DB[c] || []).forEach(function(d){ map.set(d.id, d); });
    (remote.docs[c] || []).forEach(function(d){
      const local = map.get(d.id);
      if(!local) map.set(d.id, d);
      else if(num(d.updatedAt) > num(local.updatedAt)) map.set(d.id, d);
    });
    DB[c] = Array.from(map.values());
  });
  cloudApplyRemoteTombstones(remote.tombstones || []);
  if(remote.settings){
    DB.settings = Object.assign({}, DB.settings, remote.settings.settings || {}, {theme:DB.settings.theme});
    DB.rates = Object.assign({}, DB.rates, remote.settings.rates || {});
  }
  if(!(remote.settings && remote.settings.settings && remote.settings.settings.loansInitialized)){
    legacyLoanSeed(DB);
    DB.settings.loansInitialized = true;
  }
}
function cloudApplyRemoteTombstones(list){
  (list || []).forEach(function(t){
    if(!t || !t.collection || !t.docId) return;
    const arr = DB[t.collection];
    if(!Array.isArray(arr)) return;
    const local = arr.find(function(d){ return d.id === t.docId; });
    if(!local) return;
    if(num(local.updatedAt) && num(local.updatedAt) > num(t.deletedAt)) return;
    DB[t.collection] = arr.filter(function(d){ return d.id !== t.docId; });
  });
}
function cloudSeedLast(remote){
  SYNC.last = {};
  CLOUD_COLLECTIONS.forEach(function(c){
    (remote.docs[c] || []).forEach(function(d){ SYNC.last[c + '/' + d.id] = stableJSON(d); });
  });
  if(remote.settings && remote.settings.settings){
    SYNC.last['settings/main'] = cloudSettingsSig(remote.settings.settings, remote.settings.rates || {});
  }
}
/* ---------------- push local changes ---------------- */
function queueCloudSync(){
  refreshUnsynced();
  if(CLOUD.resuming) return;
  if(!CLOUD.ready || !CLOUD.stationId || !CLOUD.user || !APP_STARTED) return;
  if(CLOUD.status === 'online') cloudSetStatus(navigator.onLine ? 'pending' : 'offline');
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(function(){ cloudPush(); }, 650);
}
async function cloudPush(){
  if(CLOUD.resuming) return;
  if(!CLOUD.ready || !CLOUD.stationId || !CLOUD.user) return;
  if(SYNC.pushing){ SYNC.again = true; return; }
  SYNC.pushing = true;
  cloudSetStatus('syncing');
  const sid = CLOUD.stationId;
  const now = Date.now();
  const userUid = CLOUD.user.uid;
  const ops = [];
  const lastSet = {};
  const lastDel = [];
  const pendingAtStart = pendingDeletesFor(sid);
  try{
    const sig = cloudSettingsSig(DB.settings, DB.rates);
    if(SYNC.last['settings/main'] !== sig){
      ops.push({type:'set', path:'stations/' + sid + '/settings/main', data:{settings:DB.settings, rates:DB.rates, updatedAt:now, updatedBy:userUid}});
      lastSet['settings/main'] = sig;
    }

    CLOUD_COLLECTIONS.forEach(function(coll){
      if(!Array.isArray(DB[coll])) DB[coll] = [];
      const seen = {};
      DB[coll].forEach(function(doc){
        if(!doc || typeof doc !== 'object') return;
        if(!doc.id) doc.id = uid(coll);
        doc.id = String(doc.id);
        const id = doc.id;
        seen[id] = true;
        const key = coll + '/' + id;
        if(SYNC.last[key] === stableJSON(doc)) return;
        const payload = Object.assign({}, doc, {updatedAt:now, updatedBy:userUid});
        doc.updatedAt = now;
        ops.push({type:'set', path:'stations/' + sid + '/' + coll + '/' + id, data:payload});
        lastSet[key] = stableJSON(doc);
      });
      Object.keys(SYNC.last).forEach(function(key){
        if(key.indexOf(coll + '/') !== 0) return;
        const id = key.slice(coll.length + 1);
        if(seen[id]) return;
        lastDel.push(key);
        ops.push({type:'del', path:'stations/' + sid + '/' + coll + '/' + id});
        ops.push({type:'set', path:'stations/' + sid + '/tombstones/' + coll + '__' + id, data:{collection:coll, docId:id, deletedAt:now, deletedBy:userUid}});
      });
    });

    // Deletions remembered from an offline session.
    pendingAtStart.forEach(function(key){
      const slash = key.indexOf('/');
      if(slash < 1) return;
      const coll = key.slice(0, slash);
      const id = key.slice(slash + 1);
      if(CLOUD_COLLECTIONS.indexOf(coll) < 0) return;
      if(lastDel.indexOf(key) >= 0) return;
      lastDel.push(key);
      ops.push({type:'del', path:'stations/' + sid + '/' + coll + '/' + id});
      ops.push({type:'set', path:'stations/' + sid + '/tombstones/' + coll + '__' + id, data:{collection:coll, docId:id, deletedAt:now, deletedBy:userUid}});
    });

    await cloudCommit(ops);
    Object.keys(lastSet).forEach(function(k){ SYNC.last[k] = lastSet[k]; });
    lastDel.forEach(function(k){ delete SYNC.last[k]; });
    if(pendingAtStart.length) removePendingDeletes(sid, pendingAtStart);
    if(ops.length) saveLocalOnly();
    CLOUD.lastSync = Date.now();
    CLOUD.error = '';
    cloudSetStatus(navigator.onLine ? 'online' : 'offline');
  } catch(e){
    CLOUD.error = e && e.message || String(e);
    cloudSetStatus('error');
  } finally {
    SYNC.pushing = false;
    if(SYNC.again){ SYNC.again = false; setTimeout(function(){ cloudPush(); }, 80); }
  }
}
async function cloudCommit(ops){
  if(!ops.length) return;
  for(let i=0; i<ops.length; i+=400){
    const batch = CLOUD.db.batch();
    ops.slice(i, i+400).forEach(function(op){
      const ref = CLOUD.db.doc(op.path);
      if(op.type === 'set') batch.set(ref, op.data);
      else batch.delete(ref);
    });
    await batch.commit();
  }
}

/* ---------------- live pull ---------------- */
function cloudStartSync(){
  cloudStopSync();
  if(!CLOUD.ready || !CLOUD.stationId || !CLOUD.user) return;
  CLOUD.resumedUid = CLOUD.stationId;
  cloudAttachListeners();
  cloudSetStatus(navigator.onLine ? 'syncing' : 'offline');
  cloudPush();
}
function cloudStopSync(){
  SYNC.unsubs.forEach(function(u){ try{ u(); } catch(e){} });
  SYNC.unsubs = [];
  clearTimeout(SYNC.timer);
  clearTimeout(SYNC.renderTimer);
  SYNC.timer = null;
  SYNC.renderTimer = null;
  SYNC.pushing = false;
  SYNC.again = false;
}
function cloudOnSyncError(err){
  CLOUD.error = err && err.message || 'Sync error';
  cloudSetStatus('error');
}
function cloudAttachListeners(){
  const sid = CLOUD.stationId;
  const settingsRef = CLOUD.db.doc('stations/' + sid + '/settings/main');
  SYNC.unsubs.push(settingsRef.onSnapshot(function(snap){
    if(!snap.exists || snap.metadata.hasPendingWrites) return;
    cloudApplySettings(snap.data());
  }, cloudOnSyncError));

  CLOUD_COLLECTIONS.forEach(function(coll){
    const ref = CLOUD.db.collection('stations/' + sid + '/' + coll);
    SYNC.unsubs.push(ref.onSnapshot(function(snap){
      if(snap.metadata.hasPendingWrites) return;
      cloudApplyCollection(coll, snap);
    }, cloudOnSyncError));
  });

  SYNC.unsubs.push(CLOUD.db.collection('stations/' + sid + '/tombstones').onSnapshot(function(snap){
    if(snap.metadata.hasPendingWrites) return;
    snap.docs.forEach(function(d){ cloudApplyTombstone(d.data()); });
  }, cloudOnSyncError));
}
function cloudApplyCollection(coll, snap){
  if(!Array.isArray(DB[coll])) DB[coll] = [];
  let changed = false;
  snap.docChanges().forEach(function(ch){
    const id = ch.doc.id;
    const key = coll + '/' + id;
    if(ch.type === 'removed'){
      const idx = DB[coll].findIndex(function(d){ return d.id === id; });
      if(idx < 0){ delete SYNC.last[key]; return; }
      const dirty = SYNC.last[key] !== undefined && stableJSON(DB[coll][idx]) !== SYNC.last[key];
      if(dirty) return;
      DB[coll].splice(idx, 1);
      delete SYNC.last[key];
      changed = true;
      return;
    }
    const data = Object.assign({}, ch.doc.data() || {});
    if(!data.id) data.id = id;
    const local = DB[coll].find(function(d){ return d.id === id; });
    if(!local){
      DB[coll].push(data);
      SYNC.last[key] = stableJSON(data);
      changed = true;
      return;
    }
    const localJson = stableJSON(local);
    const dirty = SYNC.last[key] !== undefined && localJson !== SYNC.last[key];
    const remoteJson = stableJSON(data);
    if(localJson !== remoteJson){
      if(!dirty){
        const idx = DB[coll].indexOf(local);
        DB[coll][idx] = data;
        SYNC.last[key] = stableJSON(data);
        changed = true;
      }
    } else {
      SYNC.last[key] = localJson;
    }
  });
  if(changed) cloudAfterRemoteChange();
}
function cloudApplySettings(data){
  if(!data || !data.settings) return;
  const remoteSig = cloudSettingsSig(data.settings, data.rates || {});
  if(SYNC.last['settings/main'] === remoteSig) return;
  const localSig = cloudSettingsSig(DB.settings, DB.rates);
  const dirty = SYNC.last['settings/main'] !== undefined && localSig !== SYNC.last['settings/main'];
  if(dirty) return;
  DB.settings = Object.assign({}, DB.settings, data.settings, {theme:DB.settings.theme});
  DB.rates = Object.assign({}, DB.rates, data.rates || {});
  SYNC.last['settings/main'] = cloudSettingsSig(DB.settings, DB.rates);
  document.title = appTitle();
  cloudAfterRemoteChange();
}
function cloudApplyTombstone(t){
  if(!t || !t.collection || !t.docId) return;
  const coll = t.collection;
  if(!Array.isArray(DB[coll])) return;
  const key = coll + '/' + t.docId;
  const local = DB[coll].find(function(d){ return d.id === t.docId; });
  if(!local){ delete SYNC.last[key]; return; }
  const localJson = stableJSON(local);
  const dirty = SYNC.last[key] !== undefined && localJson !== SYNC.last[key];
  if(dirty) return;
  DB[coll] = DB[coll].filter(function(d){ return d.id !== t.docId; });
  delete SYNC.last[key];
  cloudAfterRemoteChange();
}
function cloudAfterRemoteChange(){
  saveLocalOnly();
  localKnownReset();
  refreshUnsynced();
  if(!APP_STARTED) return;
  clearTimeout(SYNC.renderTimer);
  SYNC.renderTimer = setTimeout(function(){
    if(!APP_STARTED) return;
    if(document.body.classList.contains('modal-open')){ SYNC.renderPending = true; return; }
    render();
  }, 300);
}

/* ---------------- app start ---------------- */
function startCloudApp(){
  APP_STARTED = true;
  ONB.active = false;
  ONB.busy = false;
  gateBusy(false);
  document.body.classList.remove('gate-mode');
  document.title = appTitle();
  cloudStatusRefresh();
  render();
}

/* ---------------- Google sign-in ---------------- */

function cloudNativeAuthPlugin(){
  try{
    const cap = window.Capacitor;
    if(!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return null;
    return (cap.Plugins && cap.Plugins.FirebaseAuthentication) || null;
  } catch(e){ return null; }
}
async function cloudGoogleSignInNative(plugin){
  gateBusy(true, 'Opening Google…', 'Choose the account for this pump');
  try{
    // Native Google Sign-In, then bridge the ID token into the web Firebase
    // SDK so Firestore and the rest of the app see the same signed-in user.
    const result = await plugin.signInWithGoogle({ skipNativeAuth: true });
    const idToken = result && result.credential && result.credential.idToken;
    if(!idToken) throw new Error('Google did not return an ID token.');
    const credential = firebase.auth.GoogleAuthProvider.credential(idToken);
    await CLOUD.auth.signInWithCredential(credential);
    // onAuthStateChanged opens the hisab.
  } catch(e){
    gateBusy(false);
    const msg = String((e && e.message) || (e && e.code) || '');
    if(msg.indexOf('Default FirebaseApp') >= 0 || msg.indexOf('google-services') >= 0 || msg.indexOf('No provider') >= 0){
      gateError('Native Google Sign-In is not configured in this APK yet. Open the live website in Chrome, or rebuild the APK with its Firebase Android configuration.');
    } else {
      gateError('Google sign-in failed. ' + (msg || 'Please try again.'));
    }
  }
}
async function cloudGoogleSignIn(){
  if(location.protocol === 'file:'){
    gateError('Google sign-in cannot run from a local file. Open the live app: ' + LIVE_APP_URL);
    return;
  }
  if(!CLOUD.ready || !CLOUD.auth){
    gateBusy(true, 'Connecting to Firebase…');
    try{
      await cloudInit(cloudCfg());
      cloudBindAuth();
    } catch(e){
      gateBusy(false);
      gateError(e.message || 'Could not connect to Firebase.');
      return;
    }
  }
  const nativePlugin = cloudNativeAuthPlugin();
  if(nativePlugin){
    await cloudGoogleSignInNative(nativePlugin);
    return;
  }
  gateError('');
  gateBusy(true, 'Opening Google…', 'Choose the account for this pump');
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt:'select_account'});
  const native = (function(){
    try { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
    catch(e){ return false; }
  })();
  try{
    await cloudWithTimeout(CLOUD.auth.signInWithPopup(provider), 180000, 'Google sign-in timed out. Please try again.');
    // onAuthStateChanged opens the account.
  }catch(err){
    const code = (err && err.code) || '';
    const msg = String((err && err.message) || '');
    if(code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request'){
      gateBusy(false);
      if(native){
        gateError('If the Google window did not open, this app build needs native Google Sign-In. You can use the live web app in Chrome.');
      }
      return;
    }
    if(code === 'auth/popup-blocked'){
      try{
        await CLOUD.auth.signInWithRedirect(provider);
        return;
      } catch(e2){
        gateBusy(false);
        gateError(cloudAuthError(e2));
        return;
      }
    }
    gateBusy(false);
    gateError(cloudAuthError(err));
    if(native && (msg.indexOf('disallowed_useragent') >= 0 || code === 'auth/internal-error')){
      gateError('Google blocks sign-in inside the app WebView. Open the web app in Chrome, or use the native Google sign-in build.');
    }
  }
}
function cloudFriendlyError(e){
  const msg = (e && (e.code || e.message)) || '';
  if(msg.indexOf('permission-denied') >= 0 || msg.indexOf('insufficient permissions') >= 0) return 'Firestore denied access. Check that the security rules are published.';
  if(msg.indexOf('unavailable') >= 0 || msg.indexOf('offline') >= 0) return 'The cloud is unreachable right now. Your entries are safe on this device; try again when the internet returns.';
  if(msg.indexOf('not-found') >= 0) return 'The cloud hisab could not be found.';
  if(msg.indexOf('network') >= 0) return 'Network problem. Check your connection and try again.';
  return e && e.message ? e.message : 'Something went wrong.';
}
function cloudAuthError(err){
  const code = (err && err.code) || '';
  const map = {
    'auth/popup-closed-by-user': 'Google sign-in was cancelled.',
    'auth/cancelled-popup-request': 'Google sign-in was cancelled.',
    'auth/popup-blocked': 'The Google window was blocked. Allow pop-ups for this site and try again.',
    'auth/operation-not-supported-in-this-environment': 'Google sign-in needs the live website or a local HTTP server — it cannot run from a file:// preview.',
    'auth/unauthorized-domain': 'This site (' + (location.hostname || 'this domain') + ') is not authorized in Firebase Authentication. Add it to Authentication → Settings → Authorized domains.',
    'auth/operation-not-allowed': 'Google sign-in is not enabled in Firebase Authentication.',
    'auth/account-exists-with-different-credential': 'This email is already linked to a different sign-in method. Use the Google account that owns this pump.',
    'auth/network-request-failed': 'No internet connection. Check your signal and try again.',
    'auth/configuration-not-found': 'Firebase Authentication is not set up for this project yet.',
    'auth/invalid-api-key': 'The app’s Firebase configuration is invalid. Contact the app administrator.',
    'auth/too-many-requests': 'Too many attempts. Wait a minute and try again.'
  };
  if(map[code]) return map[code];
  if(code.indexOf('api-key-not-valid') >= 0) return 'The app’s Firebase configuration is invalid. Contact the app administrator.';
  if(code.indexOf('auth/') === 0) return 'Sign-in failed (' + code.replace('auth/', '') + '). Check the Firebase Authentication settings.';
  return cloudFriendlyError(err);
}
function cloudWithTimeout(promise, ms, message){
  return Promise.race([
    promise,
    new Promise(function(_, reject){ setTimeout(function(){ reject(new Error(message)); }, ms); })
  ]);
}

/* ---------------- cloud actions from Settings ---------------- */
async function cloudSignIn(){
  if(!CLOUD.ready){
    gateBusy(true, 'Connecting to Firebase…');
    try{
      await cloudInit(cloudCfg());
      cloudBindAuth();
      gateBusy(false);
    } catch(e){
      gateBusy(false);
      toast(e.message || 'Could not connect', 'err');
      return;
    }
  }
  showAuthScreen();
}
async function cloudSyncNow(){
  if(CLOUD.resuming){
    toast('Still connecting to the cloud — try again in a moment', 'err');
    return;
  }
  if(!CLOUD.ready || !CLOUD.stationId){
    toast(CLOUD.user ? 'Cloud is unavailable — changes are queued' : 'Sign in to sync', 'err');
    return;
  }
  toast('Syncing with the cloud…');
  await cloudPush();
  if(CLOUD.status === 'error') toast(CLOUD.error || 'Sync failed', 'err');
  else toast('Cloud sync complete', 'ok');
}
function confirmCloudSignOut(){
  openModal({
    title:'Sign out?',
    subtitle:'Your hisab stays saved on this phone and in the cloud.',
    submitLabel:'Sign out',
    body:'<div class="alert blue">' + icon('info', 16) + '<div>You can sign in again at any time with the same email. Nothing is deleted.</div></div>',
    onSubmit:function(){
      setTimeout(function(){
        CLOUD.backgroundBoot = false;
        CLOUD.resuming = false;
        if(!CLOUD.auth || !CLOUD.auth.currentUser){
          cloudStopSync();
          CLOUD.user = null;
          CLOUD.stationId = null;
          CLOUD.enteredUid = null;
          CLOUD.status = 'local';
          CLOUD.resumedUid = null;
          APP_STARTED = false;
          clearCloudSession();
          localClearToGate(true);
          showAuthScreen();
          return;
        }
        try { CLOUD.auth.signOut(); } catch(e){}
      }, 30);
      return {message:'Signed out'};
    }
  });
}

function cloudStateBadge(){
  if(CLOUD.status === 'error') return {html:'<span class="badge red">Sync error</span>', cls:'err'};
  if(CLOUD.status === 'online') return {html:'<span class="badge green">Synced</span>', cls:'ok'};
  if(CLOUD.status === 'offline') return {html:'<span class="badge gray">Offline</span>', cls:'warn'};
  if(CLOUD.user) return {html:'<span class="badge amber">Syncing</span>', cls:'warn'};
  return {html:'<span class="badge gray">Signed out</span>', cls:''};
}

function onbProductSelect(id, value){
  return '<select id="' + id + '">' + DB.products.map(function(p){
    return '<option value="' + attr(p.id) + '"' + (p.id === value ? ' selected' : '') + '>' + esc(p.name) + '</option>';
  }).join('') + '</select>';
}
function onbDraft(){
  const s = DB.settings || {};
  const partners = (DB.partners && DB.partners.length ? DB.partners : [
    {id:'p1', name:'', role:'Managing Partner', share:50},
    {id:'p2', name:'', role:'Partner', share:50}
  ]).map(function(p){
    return {id:p.id, name:p.name || '', role:p.role || 'Partner', share:num(p.share)};
  });
  const tanks = (DB.tanks && DB.tanks.length ? DB.tanks : [
    {id:'t1', name:'Tank 1', product:'petrol'},
    {id:'t2', name:'Tank 2', product:'diesel'}
  ]).map(function(t){
    return {id:t.id, name:t.name || '', product:t.product || 'petrol', capacity:num(t.capacity) || 1000, opening:num(t.opening), openingRate:num(t.openingRate)};
  });
  const nozzles = (DB.nozzles && DB.nozzles.length ? DB.nozzles : [
    {id:'n1', dispenser:'Dispenser 1', name:'Nozzle 1', product:'petrol'},
    {id:'n2', dispenser:'Dispenser 2', name:'Nozzle 1', product:'diesel'}
  ]).map(function(n){
    return {id:n.id, dispenser:n.dispenser || 'Dispenser 1', name:n.name || 'Nozzle 1', product:n.product || 'petrol', openingMeter:num(n.openingMeter)};
  });
  const staff = (DB.staff || []).map(function(x){
    return {id:x.id, name:x.name || '', role:x.role || '', salary:num(x.salary)};
  });
  const banks = (DB.banks || []).map(function(b){
    return {id:b.id, name:b.name || '', opening:num(b.opening)};
  });
  const linkedLoan = (DB.loans || []).filter(function(l){ return l.linkCapital; })[0] || null;
  return {
    pumpName: s.pumpName || '',
    address: s.address || '',
    phone: s.phone || '',
    openingCash: num(s.openingCash),
    partners: partners,
    loan: {
      enabled: !!s.loansEnabled,
      lenderId: linkedLoan ? linkedLoan.lenderId : (partners[0] ? partners[0].id : ''),
      borrowerId: linkedLoan ? linkedLoan.borrowerId : (partners[1] ? partners[1].id : (partners[0] ? partners[0].id : ''))
    },
    tanks: tanks,
    nozzles: nozzles,
    rates: {
      petrol: currentRate('petrol') || num((DB.rates || {}).petrol),
      diesel: currentRate('diesel') || num((DB.rates || {}).diesel)
    },
    staff: staff,
    banks: banks.length ? banks : [{id:'bnk_main', name:'Main Bank', opening:0}]
  };
}

  ONB.active = true;
  ONB.step = 0;
  ONB.busy = false;
  ONB.error = '';
  ONB.draft = onbDraft();
  gateBusy(false);

  window.scrollTo({top:0, behavior:'instant'});

    d.partners = d.partners.map(function(p, i){

    };
  }
  if(ONB.step === 2){
    d.tanks = d.tanks.map(function(t, i){
      return {id:t.id, name:val('onb-t-name-' + i).trim(), product:val('onb-t-product-' + i) || 'petrol', capacity:n('onb-t-cap-' + i), opening:n('onb-t-open-' + i), openingRate:n('onb-t-rate-' + i)};
    });

  if(ONB.step === 3){
    d.nozzles = d.nozzles.map(function(x, i){
      return {id:x.id, dispenser:val('onb-n-disp-' + i).trim(), name:val('onb-n-name-' + i).trim(), product:val('onb-n-product-' + i) || 'petrol', openingMeter:n('onb-n-meter-' + i)};
    });
  }
  if(ONB.step === 4){
    d.rates = {petrol: n('onb-rate-petrol'), diesel: n('onb-rate-diesel')};
  }

    });

}
function onbValidate(step){
  const d = ONB.draft;
  if(step === 0){
    if(!d.pumpName) return 'Enter your business / pump name.';
    if(num(d.openingCash) < 0) return 'Opening cash cannot be negative.';
  }
  if(step === 1){
    if(!d.partners.length) return 'Add at least one partner.';
    for(let i=0; i<d.partners.length; i++){
      if(!d.partners[i].name) return 'Enter the name of partner ' + (i + 1) + '.';
      if(num(d.partners[i].share) < 0) return 'Partner shares cannot be negative.';
    }
    const total = sum(d.partners, function(p){ return num(p.share); });
    if(Math.abs(total - 100) > 0.01) return 'Partner shares must add up to 100% (they add up to ' + round2(total) + '%).';
    if(d.loan && d.loan.enabled){
      if(d.partners.length < 2) return 'A partner loan needs at least two partners.';
      const ids = d.partners.map(function(p){ return p.id; });
      if(ids.indexOf(d.loan.lenderId) < 0 || ids.indexOf(d.loan.borrowerId) < 0) return 'Choose who lends and who borrows for the partner loan.';
      if(d.loan.lenderId === d.loan.borrowerId) return 'The lender and borrower must be different partners.';
    }
  }
  if(step === 2){
    if(!d.tanks.length) return 'Add at least one tank.';
    for(let i=0; i<d.tanks.length; i++){
      const t = d.tanks[i];
      if(!t.name) return 'Enter the name of tank ' + (i + 1) + '.';
      if(num(t.capacity) <= 0) return 'Tank ' + (i + 1) + ' needs a capacity greater than zero.';
      if(num(t.opening) < 0) return 'Opening stock cannot be negative.';
      if(num(t.openingRate) < 0) return 'Opening stock cost cannot be negative.';
    }
  }
  if(step === 3){
    if(!d.nozzles.length) return 'Add at least one dispenser nozzle.';
    for(let i=0; i<d.nozzles.length; i++){
      const n = d.nozzles[i];
      if(!n.dispenser) return 'Enter the dispenser name for nozzle ' + (i + 1) + '.';
      if(!n.name) return 'Enter the nozzle name for nozzle ' + (i + 1) + '.';
      if(num(n.openingMeter) < 0) return 'Opening meter reading cannot be negative.';
    }
  }
  if(step === 4){
    if(num(d.rates.petrol) < 0 || num(d.rates.diesel) < 0) return 'Selling rates cannot be negative.';
    if(num(d.rates.petrol) <= 0 && num(d.rates.diesel) <= 0) return 'Enter at least one selling rate.';
  }
  return '';
}
function onbNext(){
  if(ONB.busy) return;
  onbCapture();
  const err = onbValidate(ONB.step);
  if(err){ ONB.error = err; renderOnboarding(); return; }
  ONB.error = '';
  if(ONB.step < 6){ ONB.step++; renderOnboarding(); window.scrollTo({top:0, behavior:'instant'}); return; }
  onbFinish();
}
function onbBack(){
  if(ONB.busy) return;
  onbCapture();
  ONB.error = '';
  if(ONB.step > 0) ONB.step--;
  renderOnboarding();
}
function onbAdd(kind){
  onbCapture();
  const d = ONB.draft;
  if(kind === 'partner') d.partners.push({id:uid('p'), name:'', role:'Partner', share:0});
  if(kind === 'tank') d.tanks.push({id:uid('tank'), name:'Tank ' + (d.tanks.length + 1), product:d.tanks.length % 2 ? 'diesel' : 'petrol', capacity:1000, opening:0, openingRate:0});
  if(kind === 'nozzle') d.nozzles.push({id:uid('noz'), dispenser:'Dispenser ' + (d.nozzles.length + 1), name:'Nozzle 1', product:'petrol', openingMeter:0});
  if(kind === 'staff') d.staff.push({id:uid('stf'), name:'', role:'', salary:0});
  if(kind === 'bank') d.banks.push({id:uid('bnk'), name:'', opening:0});
  renderOnboarding();
}
function onbDel(kind, idx){
  onbCapture();
  const d = ONB.draft;
  if(kind === 'partner' && d.partners.length > 1) d.partners.splice(idx, 1);
  if(kind === 'tank' && d.tanks.length > 1) d.tanks.splice(idx, 1);
  if(kind === 'nozzle' && d.nozzles.length > 1) d.nozzles.splice(idx, 1);
  if(kind === 'staff') d.staff.splice(idx, 1);
  if(kind === 'bank' && d.banks.length > 1) d.banks.splice(idx, 1);
  renderOnboarding();
}
function onbApply(){
  const d = ONB.draft;
  DB.settings.pumpName = d.pumpName;
  DB.settings.address = d.address;
  DB.settings.phone = d.phone;
  DB.settings.openingCash = round2(num(d.openingCash));
  DB.settings.setupComplete = true;
  DB.settings.setupDismissed = true;

  DB.partners = d.partners.map(function(p){
    return {id:p.id || uid('p'), name:p.name, role:p.role || 'Partner', share:round2(num(p.share))};
  });
  DB.settings.loansEnabled = !!(d.loan && d.loan.enabled);
  DB.settings.loansInitialized = true;
  if(DB.settings.loansEnabled && DB.partners.length >= 2){
    const lenderId = (d.loan && d.loan.lenderId) || DB.partners[0].id;
    const borrowerId = (d.loan && d.loan.borrowerId) || DB.partners[1].id;
    if(lenderId !== borrowerId){
      const linked = (DB.loans || []).find(function(l){ return l.linkCapital; });
      if(linked){
        linked.lenderId = lenderId;
        linked.borrowerId = borrowerId;
      } else if(!(DB.loans || []).length){
        DB.loans.push({
          id:uid('loan'), lenderId:lenderId, borrowerId:borrowerId,
          principal:0, linkCapital:true, date:todayISO(),
          note:'Investment share funded by ' + partnerName(lenderId), createdAt:Date.now()
        });
      }
    }
  }
  DB.tanks = d.tanks.map(function(t){
    return {id:t.id || uid('tank'), name:t.name, product:t.product || 'petrol', capacity:round2(num(t.capacity)), opening:round2(num(t.opening)), openingRate:round2(num(t.openingRate))};
  });
  DB.nozzles = d.nozzles.map(function(n){
    return {id:n.id || uid('noz'), dispenser:n.dispenser, name:n.name, product:n.product || 'petrol', openingMeter:round2(num(n.openingMeter))};
  });

  ['petrol', 'diesel'].forEach(function(prod){
    const r = round2(num(d.rates[prod]));
    if(r > 0 && Math.abs(r - currentRate(prod)) > 0.001){
      DB.rateHistory.push({id:uid('rate'), product:prod, rate:r, date:todayISO(), createdAt:Date.now()});
    }
    DB.rates[prod] = r;
  });

  const staff = d.staff.filter(function(s){ return s.name; });
  if(staff.length){
    DB.staff = staff.map(function(s){
      const prev = (DB.staff || []).find(function(x){ return x.id === s.id; }) || {};
      return {id:s.id || uid('stf'), name:s.name, role:s.role || '', phone:prev.phone || '', salary:round2(num(s.salary)), joinDate:prev.joinDate || todayISO(), createdAt:prev.createdAt || Date.now()};
    });
  }

  const banks = d.banks.filter(function(b){ return b.name; });
  const hasBankTx = Array.isArray(DB.bankTx) && DB.bankTx.length > 0;
  const onlyDefaultBank = !DB.banks.length || (DB.banks.length === 1 && DB.banks[0].id === 'bnk_main');
  if(banks.length && !hasBankTx && onlyDefaultBank){
    DB.banks = banks.map(function(b){
      return {id:b.id || uid('bnk'), name:b.name, opening:round2(num(b.opening)), createdAt:Date.now()};
    });
  }
  if(!DB.banks.length) DB.banks = [{id:'bnk_main', name:'Main Bank', opening:0, createdAt:Date.now()}];

  DB.meta.createdAt = DB.meta.createdAt || new Date().toISOString();
  DB.meta.schema = 1;
}
async function onbFinish(){
  if(ONB.busy) return;
  onbCapture();
  const err = onbValidate(0) || onbValidate(1) || onbValidate(2) || onbValidate(3) || onbValidate(4);
  if(err){ ONB.error = err; renderOnboarding(); return; }
  ONB.busy = true;
  ONB.error = '';
  gateBusy(true, 'Saving your pump…', 'Writing the details and opening meters');
  try{
    onbApply();
    localTrackRemovals();
    saveLocalOnly();
    if(CLOUD.ready && CLOUD.user){
      if(!CLOUD.hasStation){
        gateBusy(true, 'Creating your cloud hisab…', 'This only happens once');
        await cloudCreateStation();
      } else {
        await cloudPush();
      }
      cloudStartSync();
    }
    ONB.busy = false;
    ONB.step = 7;
    gateBusy(false);
    renderOnboarding();
    window.scrollTo({top:0, behavior:'instant'});
  } catch(e){
    ONB.busy = false;
    gateBusy(false);
    ONB.error = 'Could not finish setup: ' + cloudFriendlyError(e) + ' Your details are saved on this phone — tap Finish setup to retry.';
    renderOnboarding();
  }
}
