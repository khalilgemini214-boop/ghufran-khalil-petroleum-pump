}

/* ---------------- CLOUD EVENT HANDLERS ---------------- */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.getAttribute('data-act');
  const idx = parseInt(el.getAttribute('data-idx'), 10);
  switch(act){
    case 'auth-google': cloudGoogleSignIn(); break;
    case 'cloud-signin': cloudSignIn(); break;
    case 'cloud-signout': confirmCloudSignOut(); break;
    case 'cloud-sync-now': cloudSyncNow(); break;
    case 'cloud-run-wizard': confirmRunWizard(); break;
    case 'onb-next': onbNext(); break;
    case 'onb-back': onbBack(); break;
    case 'onb-add-partner': onbAdd('partner'); break;
    case 'onb-del-partner': onbDel('partner', idx); break;
    case 'onb-add-tank': onbAdd('tank'); break;
    case 'onb-del-tank': onbDel('tank', idx); break;
    case 'onb-add-nozzle': onbAdd('nozzle'); break;
    case 'onb-del-nozzle': onbDel('nozzle', idx); break;
    case 'onb-add-staff': onbAdd('staff'); break;
    case 'onb-del-staff': onbDel('staff', idx); break;
    case 'onb-add-bank': onbAdd('bank'); break;
    case 'onb-del-bank': onbDel('bank', idx); break;
    case 'onb-start': onbStart(); break;
    case 'onb-cancel': onbCancel(); break;
  }
});
document.addEventListener('input', function(e){
  if(e.target && e.target.hasAttribute && e.target.hasAttribute('data-share')){
    const total = $$('[data-share]').reduce(function(a, el){ return a + num(el.value); }, 0);
    const out = $('#onb-share-total');
    if(out) out.textContent = round2(total) + '%';
  }
});
window.addEventListener('online', function(){
  (async function(){
    if(CLOUD.configured && !CLOUD.ready){
      try{
        await cloudInit(cloudCfg());
        cloudBindAuth();
      } catch(e){ return; }
    }
    if(CLOUD.resuming) return;
    if(CLOUD.backgroundBoot && !CLOUD.resumedUid){
      const current = CLOUD.auth && CLOUD.auth.currentUser;
      if(current) cloudResume(current);
      return;
    }
    if(!CLOUD.ready || !CLOUD.stationId || !CLOUD.user) return;
    cloudSetStatus('syncing');
    cloudPush();
  })();
});
window.addEventListener('offline', function(){
  if(!CLOUD.ready || !CLOUD.stationId || !CLOUD.user) return;
  cloudSetStatus('offline');
});
window.addEventListener('pagehide', function(){
  if(CLOUD.ready && CLOUD.stationId && CLOUD.user && !CLOUD.resuming){
    clearTimeout(SYNC.timer);
    cloudPush();
  }
});
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden' && CLOUD.ready && CLOUD.stationId && CLOUD.user && !CLOUD.resuming){
    clearTimeout(SYNC.timer);
    cloudPush();
  }
});

/* ---------------- BOOT ---------------- */
window.__androidBack = function(){
  try {
    if($('#modal-root') && $('#modal-root').classList.contains('open')){ closeModal(); return true; }
    if(ONB.active){
      if(ONB.busy) return true;
      if(ONB.step > 0 && ONB.step < 7){ onbBack(); return true; }
      if(DB.settings.setupComplete && ONB.step !== 7){ onbCancel(); return true; }
      return true;
    }
    if(document.body.classList.contains('gate-mode')) return true;
    if(UI.moreOpen){ closeSheet(); return true; }
    if(UI.page === 'accounts' && UI.accId){
      UI.accId = null; UI.accTxSearch = '';
      render(); window.scrollTo({top:0, behavior:'instant'});
      return true;
    }
    if(UI.page !== 'dashboard'){
      const prev = UI.navStack.length ? UI.navStack.pop() : 'dashboard';
      UI.page = prev;
      UI.accId = null; UI.moreOpen = false; closeSheet();
      render(); window.scrollTo({top:0, behavior:'instant'});
      return true;
    }
  } catch(e){}
  return false;
};
(function boot(){
  applyTheme();
  document.title = appTitle();
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ closeModal(); closeSheet(); }
  });
  $('#sheet-back').addEventListener('click', closeSheet);
  try { localStorage.removeItem('gkpp_firebase_cfg_v1'); } catch(e){}
  localKnownInit();

  const session = cloudSession();
  const hasLocalUser = !!(session && session.uid && localStorage.getItem(localDbKey(session.uid)));
  if(hasLocalUser){
    // The account and its local hisab are already known. Open instantly and
    // let Firebase reconnect in the background, online or offline.
    localSwitchUser(session);
    CLOUD.user = {
      uid:session.uid,
      email:session.email || '',
      name:session.name || '',
      photo:session.photo || ''
    };
    CLOUD.stationId = session.uid;
    CLOUD.status = navigator.onLine ? 'connecting' : 'offline';
    CLOUD.backgroundBoot = true;
    CLOUD.hasStation = !!DB.settings.setupComplete;
    if(DB.settings.setupComplete) startCloudApp();
    else startOnboarding();
    cloudBoot(true);
  } else {
    cloudBoot(false);
  }
})();

</script>
<script>
/* Live updates: the phone loads the newest app each time it opens online.
   The service worker keeps the last working copy for offline use. */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
